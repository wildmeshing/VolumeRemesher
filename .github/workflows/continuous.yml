name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ####################
  # Linux
  ####################

  Linux:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers Linux on arm64. Without it the matrix tested Linux only
        # on x86-64 and arm64 only on macOS, and no job ever compiled the combination --
        # which is where a `char` signedness bug lived undetected: `char` is signed on
        # x86-64 and under Apple's arm64 ABI but unsigned under AAPCS64. Six of these
        # integration tests fail on that platform without the accompanying BSP.h fix.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        config: [Debug, Release]
        include:
          - os: ubuntu-latest
            name: Linux
          - os: ubuntu-24.04-arm
            name: Linux arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1
        with:
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build and test dependencies
        run: python -m pip install nanobind numpy pytest

      # The Python module is built in the same tree, so its tests can compare its output
      # byte for byte with the mesh_generator built here.
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DVOLUMEREMESHER_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cd build; make -j2

      - name: Integration tests
        run: cd build && ctest --output-on-failure

      # Release only: the Python suite runs the whole model set, which a Debug build takes far
      # too long over (ctest already covers Debug through mesh_generator).
      - name: Python tests
        if: matrix.config == 'Release'
        run: VRTEST_BUILD_DIR=build PYTHONPATH=python python -m pytest tests/python -q


  ####################
  # Linux, with the legacy graph-cut classifier compiled in
  ####################

  # Not LGPL-distributable (GCO/maxflow, downloaded at configure time), so never shipped; this job keeps the
  # legacy path verified against its own hash manifest and checks that both classifiers agree
  # on closed inputs (winding_number_tests) for as long as it is kept.
  Graphcut:
    name: Linux graph-cut classifier (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1
        with:
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build and test dependencies
        run: python -m pip install nanobind numpy pytest

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DVOLUMEREMESHER_WITH_GRAPHCUT=ON \
            -DVOLUMEREMESHER_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cd build; make -j2

      - name: Tests (both classifiers)
        run: cd build && ctest --output-on-failure

      - name: Python tests
        run: VRTEST_BUILD_DIR=build PYTHONPATH=python python -m pytest tests/python -q -k "classifier or graphcut"

  ####################
  # MacOS
  ####################

  MacOS:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64).
        os: [macos-latest]
        config: [Debug, Release]
        include:
          - os: macos-latest
            name: macOS-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v1
        with:
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build and test dependencies
        run: python -m pip install nanobind numpy pytest

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DVOLUMEREMESHER_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cd build; make -j3

      - name: Integration tests
        run: cd build && ctest --output-on-failure

      - name: Python tests
        if: matrix.config == 'Release'
        run: VRTEST_BUILD_DIR=build PYTHONPATH=python python -m pytest tests/python -q

  ####################
  # Windows
  ####################

  Windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1
        with:
          fetch-depth: 10

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build and test dependencies
        run: python -m pip install nanobind numpy pytest

      # The Python module only in Release: a Debug module would link against the debug Python
      # library, which the runner's Python does not ship.
      - name: Configure and Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} ^
            -DVOLUMEREMESHER_BUILD_PYTHON=${{ matrix.config == 'Release' && 'ON' || 'OFF' }} ^
            -B build ^
            -S .
          cmake --build build -j1

      - name: Integration tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Python tests
        if: matrix.config == 'Release'
        shell: cmd
        run: |
          set VRTEST_BUILD_DIR=build
          set PYTHONPATH=python
          python -m pytest tests/python -q
