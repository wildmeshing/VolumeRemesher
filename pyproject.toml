[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "volume-remesher"
dynamic = ["version"]
description = "Exact volume meshing of triangle soups: polyhedral and tetrahedral meshes, booleans, surface embedding and 2D segment arrangements, with provenance tracking"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marco Attene" }, { name = "Daniele Panozzo" }]
keywords = ["mesh", "tetrahedral", "remeshing", "geometry", "exact predicates", "boolean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wildmeshing/VolumeRemesher"
Repository = "https://github.com/wildmeshing/VolumeRemesher"
Issues = "https://github.com/wildmeshing/VolumeRemesher/issues"

[project.scripts]
volume-remesher = "volume_remesher.__main__:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python-{wheel_tag}"
build.verbose = true
wheel.packages = ["python/volume_remesher"]
# Stable ABI from CPython 3.12 on: one wheel per platform for every later interpreter.
wheel.py-api = "cp312"
cmake.build-type = "Release"
sdist.include = ["python/volume_remesher/_version.py"]
# The sdist carries what pip needs to build the module; the models and tests live in the repository.
sdist.exclude = ["build*", ".venv", "models", "tests", "docs", ".github", ".clang-format"]

[tool.scikit-build.cmake.define]
VOLUMEREMESHER_BUILD_PYTHON = "ON"
VOLUMEREMESHER_BUILD_CLI = "OFF"
VOLUMEREMESHER_BUILD_TESTS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "python/volume_remesher/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "large: Release-only runs on large random inputs (minutes)",
    "slow: replays that take minutes (embed_regression)",
]
addopts = "-m 'not large and not slow'"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-musllinux_* *_i686 *-win32"
build-verbosity = 1
test-requires = ["pytest"]
test-command = 'pytest -x -q {project}/tests/python -m "not large and not slow and not needs_cli"'
# Every x86-64 wheel is built with AVX2/FMA, like the command line tool. See the README.
[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
archs = ["native"]
[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
[tool.cibuildwheel.windows]
archs = ["AMD64"]
